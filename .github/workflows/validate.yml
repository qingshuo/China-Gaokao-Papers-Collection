name: Validate catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate catalog
        run: python scripts/stats.py --check
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild report
        run: python scripts/stats.py --write docs/coverage.md
      - name: Check generated report
        run: git diff --exit-code -- docs/coverage.md
